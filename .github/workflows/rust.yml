name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  default:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        # os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2      
      - run: (cd dimple_ui_slint && cargo test --release -- --skip player --skip playback)
      - run: (cd dimple_ui_slint && cargo build --release)
      - uses: actions/upload-artifact@v4
        with: 
          name: ${{ matrix.os }}
          path: |
            dimple_ui_slint/target/release/dimple_ui_slint
            dimple_ui_slint/target/release/dimple_ui_slint.exe
