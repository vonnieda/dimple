[package]
name = "dimple_core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dimple_db = { path = "../../dimple_db" }
playback-rs = { path = "./vendor/playback-rs" }
symphonia = { version = "0.5.4", features = ["all"] }
# symphonia = { git = "https://github.com/pdeljanov/Symphonia.git", branch = "dev-0.6", features = ["all"] }
uuid = { version = "1.10.0", features = ["v4"] }
walkdir = "2.5.0"
tempfile = "3.13.0"
sha2 = { version = "0.10.8" }
log = "0.4.22"
env_logger = "0.11.5"
rayon = "1.10.0"
image = "0.25.5"
directories = "5.0.1"
threadpool = "1.8.1"
serde_json = "1.0.133"
serde = { version = "1.0.215", features = ["derive"] }
chrono = "0.4.38"
reqwest = { version = "0.12.9", features = ["blocking", "json"] }
include_dir = "0.7.4"
lru = "0.12.5"
anyhow = "1.0.95"
lazy_static = "1.5.0"
fast_image_resize = { version = "5.1.1", features = ["rayon"] }
fractional_index = "2.0.2"
musicbrainz_rs = { version = "0.9.0", features = ["blocking"], default-features = false }
lofty = "0.22.4"
itertools = "0.14.0"
cacache = "13.1.0"
